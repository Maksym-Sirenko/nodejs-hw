<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="font-family: Arial, sans-serif; background-color: #ffffff; padding: 20px;"
>
  <tr>
    <td>
      <h2 style="color: #1e40af; margin-bottom: 16px;">
        Hello, {{name}}!
      </h2>

      <p style="font-size: 14px; color: #111827; margin-bottom: 20px;">
        You requested to reset your password.
      </p>

      <p>
        <a
          href="{{link}}"
          style="
            display: inline-block;
            padding: 10px 16px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
          "
        >
          Reset password
        </a>
      </p>

      <p style="font-size: 12px; color: #6b7280; margin-top: 24px;">
        If you didn’t request this, you can safely ignore this email.
      </p>
    </td>
  </tr>
</table>
